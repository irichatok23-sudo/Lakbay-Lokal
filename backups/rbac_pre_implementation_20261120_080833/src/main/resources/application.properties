# ==============================================================================
# LAKBAY LOKAL: SPRING BOOT APPLICATION CONFIGURATION
# Community-Based Tourism Information System (Biliran Province)
# ==============================================================================

# Application Metadata
spring.application.name=lakbay-lokal
app.version=1.0.0
app.locale=Biliran, Philippines

# Embedded Web Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database Connection (MySQL 8.x)
spring.datasource.url=jdbc:mysql://localhost:3306/lakbay_lokal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Prevent Hibernate from altering or dropping existing tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static Resource Locations (Frontend HTML/CSS/JS)
spring.web.resources.static-locations=classpath:/static/,classpath:/web/,file:src/main/resources/web/
spring.web.resources.cache.period=0

# JSON Jackson Serialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Manila
spring.jackson.default-property-inclusion=non_null

# Multipart / File Upload Limits (For Destination Photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
