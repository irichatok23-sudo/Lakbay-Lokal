# ==============================================================================
# LAKBAY LOKAL: DATABASE & SERVER CONFIGURATION
# Default setup connects to local MySQL / XAMPP / WAMP
# ==============================================================================

# Database Connection Settings
db.host=localhost
db.port=3306
db.name=lakbay_lokal_db
db.user=root
db.password=
db.useSSL=false
db.serverTimezone=Asia/Manila
db.autoReconnect=true

# Connection Pool Settings
db.pool.maxActive=10
db.pool.maxIdle=5
db.pool.timeoutMs=5000

# Application Server Settings
server.port=8080
server.host=localhost
app.name=Lakbay Lokal - Community-Based Tourism Information System
app.version=1.0.0
